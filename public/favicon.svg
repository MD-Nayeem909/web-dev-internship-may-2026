<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Premium Indigo to Pink Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Tree Node Connectors (BST Representation) -->
    <path d="M64,28 L36,64 M64,28 L92,64 M36,64 L20,96 M36,64 L52,96" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    
    <!-- Outer Rings for Nodes -->
    <circle cx="64" cy="28" r="15" fill="none" stroke="url(#logoGrad)" stroke-width="4" />
    <circle cx="36" cy="64" r="14" fill="none" stroke="url(#logoGrad)" stroke-width="4" />
    <circle cx="92" cy="64" r="12" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.8" />
    
    <circle cx="20" cy="96" r="10" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.6" />
    <circle cx="52" cy="96" r="10" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.6" />

    <!-- Filled Center Nodes -->
    <circle cx="64" cy="28" r="10" fill="url(#logoGrad)" />
    <circle cx="36" cy="64" r="9" fill="url(#logoGrad)" />
    <circle cx="92" cy="64" r="8" fill="url(#logoGrad)" opacity="0.8" />
    <circle cx="20" cy="96" r="6" fill="url(#logoGrad)" opacity="0.6" />
    <circle cx="52" cy="96" r="6" fill="url(#logoGrad)" opacity="0.6" />
    
    <!-- White Checkmark inside Left Node (representing MCQ / Answer parsing) -->
    <path d="M31,64 L34,67 L41,59" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
